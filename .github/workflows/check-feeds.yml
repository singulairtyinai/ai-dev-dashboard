name: Check candidate feeds

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/check_feeds.py'
      - 'scripts/check_substack.py'
      - 'scripts/check_doc_sources.py'
      - '.github/workflows/check-feeds.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Check sources from the index document
        run: python scripts/check_doc_sources.py
      - name: Check substack workarounds
        run: python scripts/check_substack.py
      - name: Check all candidate feeds
        run: python scripts/check_feeds.py
