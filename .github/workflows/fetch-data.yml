name: Fetch AI Developments Data

on:
  schedule:
    # Every 2 hours. GitHub may start scheduled runs a few minutes late.
    - cron: '0 */2 * * *'
  workflow_dispatch: {}   # "Refresh now" in the admin panel, or the Actions tab

permissions:
  contents: write
  models: read

# Shares a group with the email alert workflow so the two never push at the same time.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch all sources
        run: python scripts/fetch_all.py

      - name: Generate daily summaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/summarize.py

      - name: Commit updated data
        run: |
          git config user.name "ai-dashboard-bot"
          git config user.email "actions@github.com"
          git add data/items.json data/watch.json data/health.json data/summaries.json
          git diff --quiet --cached && exit 0
          git commit -m "Scheduled data refresh"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
