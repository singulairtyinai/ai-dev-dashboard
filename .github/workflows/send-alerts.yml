name: Send email alerts

# Every 2.5 hours: 00:00, 02:30, 05:00, 07:30, 10:00, 12:30, 15:00, 17:30,
# 20:00 and 22:30 UTC. Cron has no "every 150 minutes", so two schedules
# interleave. GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *'
    - cron: '30 2,7,12,17,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Shares a group with the fetch workflow so the two never push at the same time.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send alert email
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_alerts.py

      - name: Record what was sent
        run: |
          git config user.name "ai-dashboard-bot"
          git config user.email "actions@github.com"
          [ -f data/alerts/state.json ] || exit 0
          git add data/alerts/state.json
          git diff --quiet --cached && exit 0
          git commit -m "Record sent email alert"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
