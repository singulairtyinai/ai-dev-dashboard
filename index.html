<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Developments Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="mission-bar">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>AI Developments Dashboard</h1>
      <div class="subtitle">Monitoring station · 8 channels</div>
    </div>
  </div>
  <div class="mission-bar-right">
    <div class="mission-clock">
      <span class="label">Last sync</span>
      <span id="last-sync">—</span>
    </div>
    <button class="btn secondary refresh-btn" id="refresh-btn" onclick="triggerRefresh()">↻ Refresh now</button>
    <button class="btn secondary" id="glossary-btn" onclick="toggleGlossary()">? Glossary</button>
  </div>
</div>

<div class="kpi-row" id="kpi-row"><!-- KPI cards injected here --></div>

<div class="toolbar">
  <input type="text" id="search-input" class="search-input" placeholder="Search all channels…" oninput="applyFilters()">
  <div class="chip-row" id="chip-row"><!-- category toggle chips injected here --></div>
  <div class="date-tab-row" id="date-tab-row" role="tablist" aria-label="Time range">
    <button class="date-tab" data-range="1" role="tab" aria-selected="false" onclick="setDateRange(1, this)">24h</button>
    <button class="date-tab" data-range="7" role="tab" aria-selected="false" onclick="setDateRange(7, this)">7 days</button>
    <button class="date-tab" data-range="30" role="tab" aria-selected="false" onclick="setDateRange(30, this)">30 days</button>
    <button class="date-tab active" data-range="0" role="tab" aria-selected="true" onclick="setDateRange(0, this)">All</button>
  </div>
  <button class="btn secondary toolbar-btn" onclick="clearAllFilters()">Clear filters</button>
  <div class="export-wrap">
    <button class="btn secondary toolbar-btn" onclick="toggleExportMenu()">Export view ▾</button>
    <div class="export-menu" id="export-menu" style="display:none;">
      <button onclick="exportView('markdown')">Markdown</button>
      <button onclick="exportView('json')">JSON</button>
      <button onclick="exportView('csv')">CSV</button>
    </div>
  </div>
</div>

<div class="keyword-strip" id="keyword-strip"><!-- trending keywords injected here --></div>

<div class="grid" id="channel-grid">
  <!-- channels injected by dashboard.js -->
</div>

<div class="map-section" id="map-section" style="display:none;">
  <div class="map-header">
    <h2>Governance Signal Map</h2>
    <span class="channel-meta">Recent governance activity by country/region</span>
  </div>
  <div class="map-active-filter" id="map-active-filter"></div>
  <div id="map-container"></div>
  <div class="country-timeline" id="country-timeline"></div>
</div>

<div class="glossary-panel" id="glossary-panel" style="display:none;">
  <div class="glossary-header">
    <h2>Glossary</h2>
    <button class="btn secondary" onclick="toggleGlossary()">Close ✕</button>
  </div>
  <div class="glossary-body" id="glossary-body"><!-- injected --></div>
</div>

<div class="mission-footer">
  <span>Data refreshed on schedule via GitHub Actions</span>
  <a href="control-panel.html">Control panel →</a>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/site-config.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
