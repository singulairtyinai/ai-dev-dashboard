<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07080A">
<title>AI Watchtower</title>
<meta name="description" content="Monitor for AI developments across geopolitics, governance, security, military, research, hardware and more. Updated every 2 hours.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307080A'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23F2B84B' stroke-opacity='.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23F2B84B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Navigation">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><h1>AI Watchtower</h1><small>Developments monitor</small></div></div>
    <nav class="nav" id="nav-main"></nav>
    <div>
      <div class="nav-label">Categories</div>
      <nav class="nav" id="nav-cats"></nav>
    </div>
    <div class="rail-foot">
      <div class="live"><i></i><span>Synced <span id="synced">…</span></span></div>
      <div>Next fetch <span id="nextfetch">…</span></div>
      <div id="src-count"></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Open navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="search-btn" id="search-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search headlines, sources, categories<kbd>/</kbd></button>
      <span class="spacer"></span>
      <div class="seg range" role="group" aria-label="Time range" id="range">
        <button data-r="1">24h</button><button data-r="7">7d</button><button data-r="30">30d</button><button data-r="0">All</button>
      </div>
    </header>
    <main class="view" id="view"><div class="loading">Loading the latest developments…</div></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="reader" id="reader" aria-label="Item details"></aside>
<div class="palette" id="palette" role="dialog" aria-label="Search">
  <input id="pal-input" placeholder="Search everything, or type a category or source…" autocomplete="off">
  <div class="pal-list" id="pal-list"></div>
  <div class="pal-foot"><span>↑↓ move</span><span>↵ open</span><span>esc close</span></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="assets/js/site-config.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
